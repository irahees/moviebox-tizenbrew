<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>MovieBox HD</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080a10;color:#fff;font-family:Arial,Helvetica,sans-serif}
    body{display:grid;place-items:center;text-align:center;padding:28px}
    main{max-width:720px}h1{font-size:clamp(32px,5vw,58px);margin:0 0 14px}p{color:#b8c0cf;font-size:20px;line-height:1.5}
    a{display:inline-block;margin-top:22px;padding:17px 30px;border-radius:10px;background:#e9b94e;color:#15120a;text-decoration:none;font-weight:800;font-size:20px}
    small{display:block;margin-top:24px;color:#788397}
  </style>
  <script>
    window.addEventListener('DOMContentLoaded',function(){
      var target='https://movieboxhd.net/';
      document.getElementById('open').href=target;
      // Navigate directly; the link remains as a fallback for TV browsers that block scripted navigation.
      window.location.replace(target);
    });
  </script>
</head>
<body>
  <main>
    <h1>MovieBox HD</h1>
    <p>Opening MovieBox HD…</p>
    <a id="open" href="https://movieboxhd.net/">Open MovieBox HD</a>
    <small>If the page does not open automatically, select the button with your TV remote.</small>
  </main>
</body>
</html>
